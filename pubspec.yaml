name: pilogy_app
description: PILOGY premium numerology and self-discovery mobile application.
publish_to: none
version: 1.0.12+13

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  flutter_riverpod: 2.4.9
  go_router: 12.1.3
  dio: 5.4.0
  google_mobile_ads: 6.0.0
  sqflite: 2.3.3+2
  path: ^1.9.0
  shared_preferences: 2.5.3
  # Require Android embedding v2-compatible implementations through the parent.
  path_provider: 2.1.5
  google_fonts: 6.3.2
  # Transitive Windows dependency: older versions use a removed Dart API.
  win32: '>=5.5.1 <6.0.0'
  uuid: 4.2.2
  diacritic: 0.1.5
  characters: ^1.3.0
  firebase_messaging: 14.7.10
  firebase_core: 2.24.2
  firebase_analytics: 10.8.0
  firebase_crashlytics: 3.4.9

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 2.0.3
  sqflite_common_ffi: 2.3.0

flutter:
  uses-material-design: true
  assets:
    - config/ads_util.dart
